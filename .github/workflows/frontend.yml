name: Frontend

on:
  push:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

# A newer push on the same ref makes the older run obsolete; saves CI minutes.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json, so CI and local never drift.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test:coverage

      - name: Build (includes PWA service worker)
        run: pnpm build
