name: Backend

on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']

# A newer push on the same ref makes the older run obsolete; saves CI minutes.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint + Pest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, pdo_sqlite, pdo_pgsql, zip
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Tests run on in-memory SQLite (see phpunit.xml); a key is still required to boot the app.
      - run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests (Pest)
        run: ./vendor/bin/pest --coverage
